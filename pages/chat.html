<!DOCTYPE html>
<html lang="en" class="passive-overlay-scrollbars" tabindex="0" data-settings-key="degre-chat-settings-v1">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://translate.googleapis.com https://generativelanguage.googleapis.com;"/>

    <title>DEGRE Chat Translate</title>

    <link id="favicon" rel="shortcut icon" href="./images/icon.png"/>
    <link rel="stylesheet" href="/pages/css/common.css"/>
    <link rel="stylesheet" href="css/chat.css?v=0.1.4"/>

    <script type="module">
        import {main} from './src/chat.mjs';
        main();
    </script>
</head>
<body class="transparent-bg">
    <div id="titlebar">
        <header>
            <div class="logo"><img title="icon" src="./images/icon.png"/></div>
            <div class="title">Chat Translate</div>
            <div class="filler"></div>
            <div class="buttons">
                <div class="button" id="tts-toggle" title="Read aloud"><ms>record_voice_over</ms></div>
                <a class="button open-settings" href="./settings/chat.html?width=420&height=560&child-window"
                   title="Settings" target="degre-chat-settings"><ms>settings</ms></a>
                <div title="Close" class="button close electron-only"><ms>close</ms></div>
            </div>
        </header>
    </div>

    <div id="content"></div>

    <div id="translate-status"></div>

</body>
</html>
