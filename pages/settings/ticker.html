<!DOCTYPE html>
<html lang="en" class="settings-page" tabindex="0" data-settings-key="degre-ticker-settings-v1">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>

    <title>DEGRE Ticker - Settings</title>

    <link id="favicon" rel="shortcut icon" href="../images/icon.png"/>
    <link rel="stylesheet" href="/pages/css/common.css"/>

    <script type="module">
        import {settingsMain} from '../src/ticker.mjs';
        settingsMain();
    </script>

    <style>
        #settings {
            padding: 8px 12px;
        }
        .section .title {
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        label {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
            gap: 8px;
        }
        label key {
            flex: 0 0 110px;
            font-size: 0.85em;
        }
        input[type="range"] {
            flex: 1;
            max-width: 100px;
        }
        input[type="number"] {
            width: 60px;
        }
        input[type="color"] {
            width: 40px;
            height: 24px;
            padding: 0;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 3px;
            cursor: pointer;
        }
        select {
            padding: 4px 6px;
            max-width: 150px;
        }
        textarea {
            width: 100%;
            min-height: 80px;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.3);
            color: white;
            font-family: inherit;
            font-size: 0.9em;
            resize: vertical;
            box-sizing: border-box;
            display: block;
        }
        hr {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin: 10px 0;
        }
        .hint {
            font-size: 0.75em;
            opacity: 0.6;
            margin-left: 118px;
            margin-bottom: 6px;
        }
        .text-row {
            margin-bottom: 10px;
            width: 100%;
        }
        .text-row key {
            display: block;
            font-size: 0.85em;
            margin-bottom: 6px;
        }
        .char-count {
            font-size: 0.75em;
            opacity: 0.6;
            text-align: right;
            margin-top: 2px;
        }
        .cycle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .cycle-row key {
            flex: 0 0 110px;
            font-size: 0.85em;
        }
        .cycle-row input[type="number"] {
            width: 50px;
        }
    </style>
</head>
<body>
    <div id="titlebar">
        <header>
            <div class="logo"><img title="icon" src="../images/icon.png"/></div>
            <div class="title">DEGRE Ticker - Settings</div>
            <div class="filler"></div>
            <div class="buttons">
                <div title="Close this window" class="button close electron-only">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </div>
            </div>
        </header>
    </div>

    <div id="settings">
        <form id="options" class="section">
            <div class="title">Text</div>

            <div class="text-row">
                <key>Scrolling text:</key>
                <textarea name="text" maxlength="2000" placeholder="Enter your scrolling text here..."></textarea>
                <div class="char-count"><span id="charCount">0</span> / 2000</div>
            </div>

            <hr/>
            <div class="title">Appearance</div>

            <label>
                <key>Font:</key>
                <select name="fontFamily">
                    <option value="Roboto">Roboto</option>
                    <option value="Roboto Mono">Roboto Mono</option>
                    <option value="Arial">Arial</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Impact">Impact</option>
                    <option value="Comic Sans">Comic Sans</option>
                </select>
            </label>

            <label>
                <key>Font size:</key>
                <input type="number" name="fontSize" min="10" max="200" step="1"/>
                <span style="font-size:0.85em">px</span>
            </label>

            <label>
                <key>Text color:</key>
                <input type="color" name="textColor"/>
            </label>

            <label>
                <key>Opacity:</key>
                <input type="range" name="opacity" min="0.1" max="1" step="0.05"/>
                <input type="number" name="opacity" min="0.1" max="1" step="0.05"/>
            </label>

            <hr/>
            <div class="title">Background</div>

            <label>
                <key>Background:</key>
                <select name="bgMode">
                    <option value="transparent">Transparent</option>
                    <option value="solid">Solid color</option>
                    <option value="gradient">Gradient</option>
                </select>
            </label>

            <label>
                <key>Color 1:</key>
                <input type="color" name="bgColor1"/>
            </label>

            <label>
                <key>Color 2:</key>
                <input type="color" name="bgColor2"/>
            </label>

            <label>
                <key>Gradient dir:</key>
                <select name="gradientDirection">
                    <option value="horizontal">Horizontal</option>
                    <option value="vertical">Vertical</option>
                </select>
            </label>

            <hr/>
            <div class="title">Scroll</div>

            <label>
                <key>Speed:</key>
                <input type="range" name="speed" min="1" max="10" step="1"/>
                <input type="number" name="speed" min="1" max="10" step="1"/>
            </label>
            <div class="hint">1 = slow, 10 = fast</div>

            <label>
                <key>Direction:</key>
                <select name="direction">
                    <option value="rtl">Right → Left</option>
                    <option value="ltr">Left → Right</option>
                </select>
            </label>

            <hr/>
            <div class="title">Visibility Cycle</div>

            <label>
                <key>Enable cycle:</key>
                <input type="checkbox" name="cycleEnabled"/>
            </label>
            <div class="hint">Show/hide automatically at intervals</div>

            <div class="cycle-row cycle-field">
                <key>Show for:</key>
                <input type="number" name="showFor" min="1" max="999" step="1"/>
                <select name="showMode">
                    <option value="seconds">seconds</option>
                    <option value="minutes">minutes</option>
                    <option value="loops">loops</option>
                </select>
            </div>

            <div class="cycle-row cycle-field">
                <key>Hide for:</key>
                <input type="number" name="hideFor" min="1" max="999" step="1"/>
                <select name="hideUnit">
                    <option value="seconds">seconds</option>
                    <option value="minutes">minutes</option>
                </select>
            </div>

        </form>
    </div>

    <script>
        // Character counter
        const textarea = document.querySelector('textarea[name="text"]');
        const charCount = document.getElementById('charCount');
        
        if (textarea && charCount) {
            function updateCount() {
                charCount.textContent = textarea.value.length;
            }
            textarea.addEventListener('input', updateCount);
            setTimeout(updateCount, 100);
        }
    </script>
</body>
</html>
