<!DOCTYPE html>
<html lang="en" class="settings-page" tabindex="0" data-settings-key="degre-finishwell-settings-v1">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>

    <title>DEGRE Finish Well - Settings</title>

    <link id="favicon" rel="shortcut icon" href="../images/icon.png"/>
    <link rel="stylesheet" href="/pages/css/common.css"/>

    <script type="module">
        import {settingsMain} from '../src/finishwell.mjs';
        settingsMain();
    </script>

    <style>
        .section {
            padding: 8px 12px;
        }
        .section .title {
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        label {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            gap: 6px;
        }
        key {
            flex: 0 0 160px;
            font-size: 0.85em;
        }
        input[type="range"] {
            flex: 1;
            max-width: 80px;
        }
        input[type="number"] {
            width: 70px;
        }
        input[type="color"] {
            width: 40px;
            height: 24px;
            padding: 0;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 3px;
            cursor: pointer;
        }
        hr {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin: 8px 0;
        }
        .bg-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }
        .bg-row key {
            flex: 0 0 160px;
        }
        .transparent-label {
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 0;
            font-size: 0.85em;
        }
        .distance-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
        }
        .distance-row key {
            flex: 0 0 160px;
            font-size: 0.85em;
        }
        .always-label, .autosize-label, .autodetect-label {
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 0;
            font-size: 0.8em;
            opacity: 0.9;
        }
        .hint {
            font-size: 0.75em;
            opacity: 0.6;
            margin-left: 166px;
            margin-bottom: 5px;
        }
        .font-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
        }
        .font-row key {
            flex: 0 0 160px;
            font-size: 0.85em;
        }
        .sprint-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 5px;
        }
        .sprint-row key {
            flex: 0 0 160px;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div id="titlebar">
        <header>
            <div class="logo"><img title="icon" src="../images/icon.png"/></div>
            <div class="title">DEGRE Finish Well - Settings</div>
            <div class="filler"></div>
            <div class="buttons">
                <div title="Close this window" class="button close electron-only">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </div>
            </div>
        </header>
    </div>

    <div id="settings">
        <form id="options" class="section">
            <div class="title">Display</div>

            <label>
                <key>Opacity:</key>
                <input type="range" name="opacity" min="0.1" max="1" step="0.05"/>
                <input type="number" name="opacity" min="0.1" max="1" step="0.05"/>
            </label>

            <div class="bg-row">
                <key>Background:</key>
                <input type="color" name="bgColor"/>
                <label class="transparent-label">
                    <input type="checkbox" name="bgTransparent"/>
                    <span>Transparent</span>
                </label>
            </div>

            <div class="font-row">
                <key>Font size:</key>
                <input type="number" name="fontSize" min="20" max="300" step="5"/>
                <span style="font-size:0.85em">px</span>
                <label class="autosize-label">
                    <input type="checkbox" name="fontAutoSize"/>
                    <span>Auto-size</span>
                </label>
            </div>

            <hr/>
            <div class="title">Visibility</div>

            <div class="distance-row">
                <key>Show under:</key>
                <input type="number" name="visibilityDistance" min="100" max="50000" step="100"/>
                <span style="font-size:0.85em">m</span>
                <label class="always-label">
                    <input type="checkbox" name="visibilityAlways"/>
                    <span>Always</span>
                </label>
            </div>

            <hr/>
            <div class="title">Audio</div>

            <label>
                <key>Volume:</key>
                <input type="range" name="audioVolume" min="0" max="100" step="5"/>
                <input type="number" name="audioVolume" min="0" max="100" step="5"/>
            </label>

            <label>
                <key>Bell at:</key>
                <input type="number" name="bellDistance" min="0" max="5000" step="100"/>
                <span style="font-size:0.85em">m</span>
            </label>
            <div class="hint">0 = disabled</div>

            <div class="sprint-row">
                <key>Sprint at:</key>
                <input type="number" name="sprintDistance" min="0" max="2000" step="50"/>
                <span style="font-size:0.85em">m</span>
                <label class="autodetect-label">
                    <input type="checkbox" name="sprintAutodetect"/>
                    <span>Autodetect</span>
                </label>
            </div>
            <div class="hint">0 = disabled. Loop plays until finish.</div>

            <label class="sprint-threshold-row">
                <key>Sprint power threshold:</key>
                <input type="number" name="sprintPowerThreshold" min="200" max="1500" step="50"/>
                <span style="font-size:0.85em">W</span>
            </label>
            <div class="hint sprint-threshold-row">Autodetect: starts loop when power exceeds this</div>

            <label>
                <key>Applause at finish:</key>
                <input type="checkbox" name="audioApplause"/>
            </label>

        </form>
    </div>
</body>
</html>
